[project]
name = "locus-core"
version = "0.1.0"
description = "Locus core service — agent loop, providers, storage, and the core<->endpoint WebSocket link host."
readme = { text = "locus-core — the Locus core service package.\n", content-type = "text/plain" }
requires-python = ">=3.11"
license = { file = "../LICENSE" }

dependencies = [
    # api / server
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "sse-starlette>=2.1",
    "websockets>=12",
    # providers
    "anthropic>=0.40",
    "openai>=1.40",
    "google-genai>=1.0",
    "httpx>=0.27",
    # storage
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20",
    # observability
    "structlog>=24.1",
    "opentelemetry-api>=1.25",
    # config
    "pydantic-settings>=2.3",
    # browser (file-tools / playwright-backed tool surface)
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
locus-core = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Flat layout: ship the loose top-level .py modules and the top-level
# subpackages as siblings on the wheel root. Imports are bare:
#   from app import main ; from providers.anthropic import AnthropicProvider
# Each `sources = ["."]` entry lifts its file/dir to the wheel root.
[tool.hatch.build.targets.wheel]
only-include = [
    "app.py",
    "auth.py",
    "paths.py",
    "protocol.py",
    "settings.py",
    "agent",
    "api",
    "bus",
    "endpoint_conn",
    "observability",
    "providers",
    "skills",
    "storage",
    "tools",
]
sources = ["."]

# Ship the config TOMLs as package data so the settings loader can find them
# next to the installed modules (config.toml is loaded by settings.py at a path
# resolved relative to __file__).
[tool.hatch.build.targets.wheel.force-include]
"config.toml" = "config.toml"
"tools.toml" = "tools.toml"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app", "agent", "api", "bus", "endpoint_conn", "observability", "providers", "skills", "storage", "tools", "auth", "paths", "protocol", "settings"]

[[tool.mypy.overrides]]
module = ["google.genai.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"

# Locus monorepo root.
#
# locus-core is its own installable package (see locus-core/pyproject.toml) and
# ships the `locus-core` console script. This root project is deliberately NOT
# an installable package: the endpoint/ tree stays a loose directory until its
# deferred rebuild (TUI / webdash / desktop split), at which point it will get
# its own per-variant package. Until then, this file only carries:
#   * dev/lint config ([tool.ruff], mypy overrides, pytest testpaths) so ruff /
#     mypy / pytest run from the repo root against endpoint/ + tests/, and
#   * the loose dev deps (ruff/mypy/pytest) and endpoint runtime deps that
#     aren't owned by locus-core.
#
# Do NOT add a [tool.hatch.build.targets.wheel] section here: there is no
# root-level package to build. locus-core builds itself; endpoint/ will become
# its own packages in the deferred rebuild.

[project]
name = "locus-monorepo"
version = "0.0"
description = "Locus monorepo root (dev tooling + loose endpoint deps; not installable)."
requires-python = ">=3.11"
license = { file = "LICENSE" }

dependencies = [
    # endpoint loose deps (endpoint/ is not its own package yet; it imports
    # these and they must be present in the active env). Move these into the
    # per-variant endpoint pyproject when the rebuild lands.
    "textual>=0.86",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-httpserver>=1.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
# endpoint runs as a module on the loose endpoint/ dir at the repo root.
locus-endpoint = "endpoint.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
# Bare first-party names that resolve via the editable locus-core install, plus
# the loose endpoint/ packages.
known-first-party = [
    "app", "agent", "api", "bus", "endpoint_conn", "observability",
    "providers", "skills", "storage", "tools",
    "auth", "paths", "protocol", "settings",
    "endpoint",
]

[[tool.mypy.overrides]]
module = ["google.genai.*", "playwright.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
